<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="uGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" stroke="#334155" stroke-width="6" fill="none" opacity="0.6"/>

  <!-- Stylized U Letterform -->
  <path d="M148 136 V284 C148 348 196 392 256 392 C316 392 364 348 364 284 V136" 
        stroke="url(#uGrad)" 
        stroke-width="52" 
        stroke-linecap="round" 
        fill="none" 
        filter="url(#glow)"/>

  <!-- AI Sparkle / Star at Top Right -->
  <g transform="translate(360, 110)">
    <path d="M0 -36 Q0 0 36 0 Q0 0 0 36 Q0 0 -36 0 Q0 0 0 -36 Z" fill="url(#sparkleGrad)"/>
    <circle cx="0" cy="0" r="8" fill="#ffffff"/>
  </g>

  <!-- Small accent node -->
  <circle cx="256" cy="316" r="14" fill="#10b981"/>
</svg>
